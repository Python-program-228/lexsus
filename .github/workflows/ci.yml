name: CI

on:
  push:
    branches: [main, developing]
  pull_request:

jobs:
  frontend:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  rust-core:
    name: Rust core (check + fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libglib2.0-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
      # Phase 1: the task state machine, process registry and MCP client
      # have unit tests — run them so logic regressions fail CI, not users.
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  spec-sync:
    name: Extension ↔ core spec sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # The SPECS table (bridge.rs) and TOOLS table (tool-spec.js) are one
      # source of truth in two languages; this script is the guard.
      - run: node scripts/check-spec-sync.mjs

  compression-service:
    name: Compression service (health)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: compression-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fastapi uvicorn pydantic httpx2
      - run: |
          python -c "
          from fastapi.testclient import TestClient
          from main import app
          c = TestClient(app)
          r = c.get('/health')
          assert r.status_code == 200, r.text
          print('health OK')
          "