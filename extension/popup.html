<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      /* Shares the desktop app's identity: oklch dark palette, one teal
         accent, hairline translucent borders. Mirrors styles.css v3. */
      :root {
        --bg: oklch(0.145 0.004 260);
        --surface: oklch(0.175 0.005 260);
        --surface-2: oklch(0.215 0.006 260);
        --border: oklch(1 0 0 / 8%);
        --border-strong: oklch(1 0 0 / 16%);
        --text: oklch(0.955 0 0);
        --text-muted: oklch(0.66 0 0);
        --text-dim: oklch(0.48 0 0);
        --accent: oklch(0.77 0.12 180);
        --accent-hover: oklch(0.68 0.11 180);
        --accent-foreground: oklch(0.18 0.03 190);
        --danger: oklch(0.7 0.18 25);
        --danger-hover: oklch(0.6 0.17 25);
        --warning: oklch(0.8 0.13 85);
        --success-border: oklch(0.77 0.12 180 / 28%);
        --pending-border: oklch(0.8 0.13 85 / 28%);
        --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
        --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        width: 280px;
        font-family: var(--font-ui);
        background: var(--bg);
        color: var(--text);
        margin: 0;
        padding: 16px;
      }
      h1 {
        font-size: 13px;
        font-weight: 600;
        margin: 0 0 12px;
        color: var(--text);
        letter-spacing: -0.01em;
      }
      .status {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 14px;
        font-size: 11px;
        color: var(--text-muted);
      }
      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--text-dim);
        transition: background 120ms ease;
      }
      .dot.on {
        background: var(--accent);
        box-shadow: 0 0 6px var(--accent);
      }
      .input-row {
        display: flex;
        gap: 6px;
        margin-bottom: 10px;
      }
      input {
        flex: 1;
        min-width: 0;
        padding: 6px 8px;
        background: var(--surface);
        color: var(--text);
        border: 1px solid var(--border-strong);
        border-radius: 6px;
        font-size: 12px;
        letter-spacing: 2px;
        font-family: var(--font-mono);
        outline: none;
        transition: border-color 120ms ease;
      }
      input::placeholder {
        color: var(--text-dim);
        letter-spacing: 0;
        font-family: var(--font-ui);
      }
      input:focus {
        border-color: var(--accent);
      }
      button {
        padding: 6px 12px;
        background: var(--accent);
        color: var(--accent-foreground);
        border: none;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        transition: background 120ms ease, transform 80ms ease;
      }
      button:active {
        transform: scale(0.97);
      }
      button:hover {
        background: var(--accent-hover);
      }
      button.secondary {
        background: transparent;
        border: 1px solid var(--border-strong);
        color: var(--text);
      }
      button.secondary:hover {
        background: var(--surface-2);
      }
      button.danger {
        background: transparent;
        border: 1px solid var(--danger);
        color: var(--danger);
      }
      button.danger:hover {
        background: var(--danger);
        color: oklch(0.98 0.01 25);
      }
      .action-row {
        display: flex;
        gap: 6px;
        margin-bottom: 10px;
      }
      .action-row button {
        flex: 1;
      }
      #msg {
        font-size: 11px;
        color: var(--warning);
        min-height: 14px;
        margin: 6px 0;
      }
      .hint {
        font-size: 10px;
        color: var(--text-dim);
        margin-top: 12px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <h1>AI Continuity Bridge</h1>
    <div class="status">
      <span class="dot" id="dot"></span>
      <span id="statusText">checking…</span>
    </div>
    <div class="input-row">
      <input id="code" maxlength="6" placeholder="6-digit code" />
      <button id="pair">Pair</button>
    </div>
    <div class="action-row">
      <button id="handoff" class="secondary">Handoff to ChatGPT</button>
      <button id="unpair" class="danger">Unpair</button>
    </div>
    <div class="action-row">
      <button id="manifest" class="secondary" title="Tell the open chat which local tools it can call">
        Send tool manifest
      </button>
    </div>
    <div id="msg"></div>
    <div class="hint">
      Open the desktop app → Web-AI Bridge panel → copy the pairing code. Handoffs appear as a card at the top of ChatGPT, Claude.ai, Gemini or Grok. Use <b>Send tool manifest</b> to give an existing chat the tool list without a handoff.
    </div>
    <script src="popup.js"></script>
  </body>
</html>
