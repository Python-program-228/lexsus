<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { width: 280px; font-family: system-ui, sans-serif; background: #161616; color: #e6e6e6; margin: 0; padding: 12px; }
      h1 { font-size: 14px; margin: 0 0 8px; }
      .row { display: flex; gap: 6px; margin-bottom: 8px; }
      input { flex: 1; min-width: 0; padding: 6px; background: #0d0d0d; color: #e6e6e6; border: 1px solid #444; border-radius: 4px; letter-spacing: 2px; font-family: monospace; }
      button { padding: 6px 10px; background: #2f6feb; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
      button.secondary { background: #374151; }
      button.danger { background: #b91c1c; }
      #status { font-size: 12px; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
      .dot { width: 9px; height: 9px; border-radius: 50%; background: #6b7280; display: inline-block; }
      .dot.on { background: #22c55e; }
      .hint { font-size: 11px; color: #9a9a9a; margin-top: 8px; }
      #msg { font-size: 12px; color: #facc15; min-height: 14px; margin: 6px 0; }
    </style>
  </head>
  <body>
    <h1>AI Continuity Bridge</h1>
    <div id="status"><span class="dot" id="dot"></span><span id="statusText">checking…</span></div>
    <div class="row">
      <input id="code" maxlength="6" placeholder="6-digit code from the app" />
      <button id="pair">Pair</button>
    </div>
    <div class="row">
      <button id="handoff" class="secondary" style="flex:1">Send handoff to ChatGPT</button>
      <button id="unpair" class="danger">Unpair</button>
    </div>
    <div id="msg"></div>
    <div class="hint">
      Open the desktop app → Web-AI Bridge panel → copy the pairing code.
      Handoffs appear as a card at the top of chatgpt.com.
    </div>
    <script src="popup.js"></script>
  </body>
</html>
